########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        description: 'Empty string accepted from external applications.'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        description: 'Empty string accepted from external applications.'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
    mountName:
      name: mountName
      in: path
      required: true
      schema:
        type: string
        example: '222250001'
      description: 'The mountName of the device that is addressed by the request'
    uuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        example: 'LTP-MWPS-TTP-1-1'
      description: 'Instance identifier that is unique within the device'
    uuid1:
      name: uuid1
      in: path
      required: true
      schema:
        type: string
        example: 'LTP-MWPS-TTP-1-1'
      description: 'Another instance identifier that is unique within the device'
    localId:
      name: localId
      in: path
      required: true
      schema:
        type: string
        example: 'LP-MWPS-TTP-1-1'
      description: 'Instance identifier that is unique within its list'
    fields:
      name: fields
      in: query
      required: false
      schema:
        type: string
        example: 'node(node-id;netconf-node-topology:connection-status)'
      description: 'Query parameter to filter ressources according to RFC8040 fields filter spec'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
        backend-time:
          schema:
            type: integer
            example: 850
          description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
  headers:
    x-correlator:
      schema:
        type: string
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
    exec-time:
      schema:
        type: integer
        example: 1100
      description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    backend-time:
      schema:
        type: integer
        example: 850
      description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
    life-cycle-state:
      schema:
        type: string
        enum:
          - 'EXPERIMENTAL'
          - 'OPERATIONAL'
          - 'DEPRECATED'
          - 'OBSOLETE'
          - 'UNKNOWN'
          - 'NOT_YET_DEFINED'
        example: 'EXPERIMENTAL'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    wire-interface-capability:
      type: object
      required:
        - supported-pmd-kind-list
        - auto-pmd-negotiation-is-avail
        - auto-negotiation-pmd-selection-is-avail
        - supported-signal-ordering-kind-list
        - auto-signal-ordering-is-avail
        - configuration-of-rx-sync-preference-is-avail
        - mii-kind
        - mdi-kind
        - required-medium-kind
        - wavelength-grid-min
        - short-reach-mode-is-avail
        - eee-is-avail
        - unidirectional-operation-is-avail
        - rxlevel-low-threshold
        - rxlevel-high-threshold
        - temperature-low-threshold
        - temperature-high-threshold
        - configuration-of-number-of-bip-errors-per-ses-is-avail
        - admin-shut-down-is-avail
        - isolation-is-avail
        - supported-loop-back-kind-list
        - maintenance-timer-range
        - performance-monitoring-is-avail
      properties:
        supported-pmd-kind-list:
          type: array
          minItems: 1
          x-key: pmd-name
          items:
            type: object
            required:
              - pmd-name
              - speed
              - duplex
            properties:
              pmd-name:
                type: string
              speed:
                type: string
              duplex:
                type: string
                enum:
                  - 'wire-interface-2-0:DUPLEX_TYPE_HALF_DUPLEX'
                  - 'wire-interface-2-0:DUPLEX_TYPE_FULL_DUPLEX'
                  - 'wire-interface-2-0:DUPLEX_TYPE_NOT_YET_DEFINED'
        auto-pmd-negotiation-is-avail:
          type: boolean
        auto-negotiation-pmd-selection-is-avail:
          type: boolean
        supported-signal-ordering-kind-list:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - 'wire-interface-2-0:SIGNAL_ORDERING_KIND_TYPE_MDI'
              - 'wire-interface-2-0:SIGNAL_ORDERING_KIND_TYPE_MDI_X'
              - 'wire-interface-2-0:SIGNAL_ORDERING_KIND_TYPE_NOT_YET_DEFINED'
        auto-signal-ordering-is-avail:
          type: boolean
        configuration-of-rx-sync-preference-is-avail:
          type: boolean
        mii-kind:
          type: string
          enum:
            - 'wire-interface-2-0:MII_KIND_TYPE_GBIC'
            - 'wire-interface-2-0:MII_KIND_TYPE_SOLDERED_CONNECTOR'
            - 'wire-interface-2-0:MII_KIND_TYPE_SFP_SFP_PLUS_SFP28'
            - 'wire-interface-2-0:MII_KIND_TYPE_XBI_300_PIN'
            - 'wire-interface-2-0:MII_KIND_TYPE_XENPAK'
            - 'wire-interface-2-0:MII_KIND_TYPE_XFP'
            - 'wire-interface-2-0:MII_KIND_TYPE_XFP_E'
            - 'wire-interface-2-0:MII_KIND_TYPE_XPAK'
            - 'wire-interface-2-0:MII_KIND_TYPE_X2'
            - 'wire-interface-2-0:MII_KIND_TYPE_DWDM_SFP_SFP_PLUS'
            - 'wire-interface-2-0:MII_KIND_TYPE_QSFP'
            - 'wire-interface-2-0:MII_KIND_TYPE_QSFP_PLUS'
            - 'wire-interface-2-0:MII_KIND_TYPE_CXP'
            - 'wire-interface-2-0:MII_KIND_TYPE_SHIELDED_MINI_MULTILANE_HD_4X'
            - 'wire-interface-2-0:MII_KIND_TYPE_SHIELDED_MINI_MULTILANE_HD__X'
            - 'wire-interface-2-0:MII_KIND_TYPE_QSFP28'
            - 'wire-interface-2-0:MII_KIND_TYPE_CXP2'
            - 'wire-interface-2-0:MII_KIND_TYPE_CDFP_STYLE1_STYLE2'
            - 'wire-interface-2-0:MII_KIND_TYPE_SHIELDED_MINI_MULTILANE_HD_4X_FAN_OUT'
            - 'wire-interface-2-0:MII_KIND_TYPE_SHIELDED_MINI_MULTILANE_HD_8X_FAN_OUT'
            - 'wire-interface-2-0:MII_KIND_TYPE_CDFP_STYLE3'
            - 'wire-interface-2-0:MII_KIND_TYPE_QSFP_MICRO'
            - 'wire-interface-2-0:MII_KIND_TYPE_QSFP_DD'
