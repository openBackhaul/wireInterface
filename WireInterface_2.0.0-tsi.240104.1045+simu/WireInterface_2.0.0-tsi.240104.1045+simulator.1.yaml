        wavelength-min-list:
          type: array
          minItems: 0
          maxItems: 3
          items:
            type: integer
            format: int32
        wavelength-max-list:
          type: array
          minItems: 0
          maxItems: 3
          items:
            type: integer
            format: int32
        wavelength-grid-min:
          type: integer
          format: int32
        short-reach-mode-is-avail:
