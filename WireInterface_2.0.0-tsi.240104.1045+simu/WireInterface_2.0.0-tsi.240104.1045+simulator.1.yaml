            enum:
              - 'wire-interface-2-0:LOOP_BACK_TYPE_NONE'
              - 'wire-interface-2-0:LOOP_BACK_TYPE_EXTERNAL'
              - 'wire-interface-2-0:LOOP_BACK_TYPE_INTERNAL'
              - 'wire-interface-2-0:LOOP_BACK_TYPE_NOT_YET_DEFINED'
